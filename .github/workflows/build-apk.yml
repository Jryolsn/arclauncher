name: Build APK

# Jryolsn fork: builds a sideload APK on every push, for automatic install on our TV.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build release APK (no self-updater)
        env:
          SIDELOAD_SIGNING: "true"
        run: flutter build apk --release --flavor github --build-name=${GITHUB_SHA::7}
      - uses: actions/upload-artifact@v4
        with:
          name: arc-launcher
          path: build/app/outputs/flutter-apk/*armeabi-v7a*.apk
          if-no-files-found: error
